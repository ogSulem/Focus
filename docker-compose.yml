version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: focus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: focus_secret
      POSTGRES_DB: focus
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U focus -d focus']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - focus_net

  backend:
    container_name: focus_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://focus:focus_secret@db:5432/focus
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_256}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_256}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3001
      NODE_ENV: production
    ports:
      - '3001:3001'
    networks:
      - focus_net

  frontend:
    container_name: focus_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      # Internal URL used by SSR (server-to-server inside Docker network)
      INTERNAL_API_URL: http://backend:3001/api
      NODE_ENV: production
    ports:
      - '3000:3000'
    networks:
      - focus_net

volumes:
  pg_data:

networks:
  focus_net:
    driver: bridge
